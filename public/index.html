<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalogue Maker</title>
<meta name="description" content="Photograph products, straighten and cut them out, and create catalogue PDFs to share on WhatsApp. Works offline on your phone.">
<meta name="theme-color" content="#1D2340">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catalogue">
<meta name="format-detection" content="telephone=no">
<link id="manifest" rel="manifest" href="data:application/manifest+json,%7B%7D">
<link id="appicon" rel="icon" href="data:,">
<style>
/* ===================== Catalogue Maker · styles ===================== */
:root {
  --ink: #1D2340; --ink2: #3C4466; --muted: #646C8C; --line: #D9DDE8; --line2: #E7EAF1;
  --bg: #EEF0F5; --card: #FFFFFF; --sunk: #F5F6FA;
  --tag: #FFC93C; --tag-ink: #261C00; --tag-deep: #E2A300;
  --ok: #0F7A56; --ok-bg: #E2F3EB; --warn: #8A5300; --warn-bg: #FFF2D2; --bad: #BE2D4B; --bad-bg: #FCE7EC;
  --stage: #13172A; --stage2: #1B2036;
  --focus: #3550E6;
  --r1: 8px; --r2: 14px; --r3: 22px;
  --sh1: 0 1px 2px rgba(29, 35, 64, .07), 0 3px 10px rgba(29, 35, 64, .05);
  --sh2: 0 10px 34px rgba(19, 23, 42, .22);
  --font: "CM Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
  --navh: 66px; --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E9ECF7; --ink2: #C6CBDF; --muted: #9AA2BF; --line: #2E3553; --line2: #262C46;
    --bg: #0F1220; --card: #181D30; --sunk: #13172A;
    --ok: #46C79A; --ok-bg: #12352A; --warn: #F2B53D; --warn-bg: #362A0E; --bad: #F4738E; --bad-bg: #3A1520;
    --sh1: 0 1px 2px rgba(0, 0, 0, .3); --sh2: 0 10px 34px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--bg); padding-bottom: calc(var(--navh) + var(--safe-b) + 8px); -webkit-tap-highlight-color: transparent; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 20px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15.5px; font-weight: 700; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--card); padding: 8px 12px; z-index: 99; }
.skip:focus { left: 8px; }
.ic { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ic svg { width: 100%; height: 100%; }
.ic-inline .ic { width: 14px; height: 14px; vertical-align: -2px; }

/* splash */
#splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 100; transition: opacity .3s; }
#splash.out { opacity: 0; }
.splash-tag { display: grid; place-items: center; width: 84px; height: 56px; padding-left: 14px; background: var(--tag); color: var(--tag-ink); font: 700 30px var(--font); clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%); }

/* ---- the price tag (signature) ---- */
.tag { position: relative; display: inline-flex; align-items: center; height: 24px; padding: 0 9px 0 17px; background: var(--tag); color: var(--tag-ink); font-weight: 700; font-size: 12.5px; letter-spacing: .01em; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); border-radius: 0 4px 4px 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag::before { content: ''; position: absolute; left: 7px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--card); }
.tag.big { height: 44px; font-size: 20px; padding: 0 18px 0 30px; clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%); border-radius: 0 8px 8px 0; }
.tag.big::before { left: 13px; width: 8px; height: 8px; margin-top: -4px; }

/* ---- buttons & controls ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid transparent; background: var(--sunk); font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: transform .08s, background .15s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost.light { color: #fff; border-color: rgba(255,255,255,.4); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.big { min-height: 52px; font-size: 16px; padding: 0 26px; }
.btn .ic { width: 18px; height: 18px; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: inherit; flex: none; }
.icon-btn:hover { background: var(--sunk); }
.icon-btn.small { width: 34px; height: 34px; }
.icon-btn:disabled { opacity: .3; }
.linkish { border: 0; background: none; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid var(--line); background: var(--card); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.chip b { font-weight: 700; font-size: 12px; color: var(--muted); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.on b { color: inherit; opacity: .75; }
.chip.warn:not(.on) b { color: var(--warn); }
.chip.small { height: 28px; font-size: 12.5px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.tight { padding: 6px 0 0; margin: 0; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--sunk); border: 1.5px solid var(--line2); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; font-size: 13.5px; font-weight: 500; white-space: nowrap; color: var(--ink2); }
.seg-btn.on { background: var(--card); color: var(--ink); box-shadow: var(--sh1); font-weight: 600; }
.seg-btn .ic { width: 16px; height: 16px; }
.seg.small .seg-btn { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 0; min-width: 0; }
.f-label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.f-hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=search], input[type=url], input[type=email], input[type=tel], input:not([type]), select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 15.5px; }
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--ink2); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
input[type=color] { width: 100%; height: 44px; padding: 3px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; border-bottom: 1px solid var(--line2); }
.toggle:last-child { border-bottom: 0; }
.tg-txt { flex: 1; display: flex; flex-direction: column; font-size: 14.5px; }
.tg-txt small { color: var(--muted); font-size: 12.5px; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tg-ui { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--line); flex: none; transition: background .15s; }
.tg-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked + .tg-ui { background: var(--ok); }
.toggle input:checked + .tg-ui::after { transform: translateX(18px); }
.toggle input:focus-visible + .tg-ui { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.slider { display: flex; flex-direction: column; gap: 2px; margin: 8px 0; }
.sl-head { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink2); }
.sl-head output { font-variant-numeric: tabular-nums; color: var(--muted); }
input[type=range] { width: 100%; height: 30px; accent-color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-row.wrap { flex-wrap: wrap; }
.warnline { display: flex; gap: 8px; align-items: flex-start; color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: 10px; font-size: 13px; }
.okline { color: var(--ok); }
.pbar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 4px; transition: width .2s; }
.pbar.warn i { background: var(--warn); }
.pbar.indet i { width: 35% !important; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.pre { white-space: pre-wrap; font-size: 12px; max-height: 50vh; overflow: auto; background: var(--sunk); padding: 10px; border-radius: 8px; }

/* ---- layout ---- */
main { max-width: 1180px; margin: 0 auto; padding: 0 16px 24px; outline: none; }
.top { padding: 14px 0 6px; }
.top-row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.top-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top-title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-logo { height: 40px; max-width: 120px; object-fit: contain; object-position: left center; }
.top-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--card); box-shadow: var(--sh1); }
.savestate { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.savestate .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.savestate.bad { color: var(--bad); font-weight: 600; }
.savestate .ic { width: 15px; height: 15px; }
.banners { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 12px; font-size: 13.5px; }
.banner p { flex: 1; margin: 0; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner .btn { background: var(--card); color: var(--ink); }
.stats { display: flex; gap: 10px; overflow-x: auto; margin: 10px -16px 2px; padding: 0 16px; scrollbar-width: none; }
.stats div { flex: none; display: flex; flex-direction: column; padding: 8px 14px; background: var(--card); border-radius: 12px; box-shadow: var(--sh1); min-width: 92px; }
.stats b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.searchbar { display: flex; align-items: center; gap: 8px; margin: 12px 0 10px; padding: 0 6px 0 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; }
.searchbar .ic { color: var(--muted); }
.searchbar input { border: 0; box-shadow: none !important; padding-left: 0; background: transparent; }
.brandsel { width: auto; max-width: 42%; min-height: 36px; border: 0; background: var(--sunk); font-size: 13.5px; padding: 6px 8px; }
.list-head { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 6px; }

/* ---- product grid (virtualised) ---- */
.pgrid { position: relative; --cols: 2; }
.tile { position: absolute; top: 0; left: 0; width: calc((100% - (var(--cols) - 1) * 12px) / var(--cols)); background: var(--card); border-radius: var(--r2); box-shadow: var(--sh1); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; border: 2px solid transparent; }
.tile.sel { border-color: var(--ink); }
.t-img { aspect-ratio: 1 / .86; background: #F2F1EC; display: grid; place-items: center; overflow: hidden; }
.t-img img { width: 100%; height: 100%; object-fit: cover; }
.t-noimg { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8F9F; font-size: 12.5px; }
.t-body { padding: 8px 10px 10px; height: 96px; display: flex; flex-direction: column; gap: 3px; }
.t-brand { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-row { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.t-size { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-status { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 600; background: rgba(255,255,255,.92); color: var(--ink); box-shadow: var(--sh1); }
.t-status.review { background: var(--warn-bg); color: var(--warn); }
.t-status.nophoto { background: var(--sunk); color: var(--muted); }
.t-check { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.25); color: transparent; }
.t-check.on { background: var(--ink); color: #fff; }
.t-check .ic { width: 16px; height: 16px; }
.empty-filter { padding: 40px 0; text-align: center; color: var(--muted); }
.selbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px; margin: 0 -8px; background: var(--bg); flex-wrap: wrap; }
.selbar-acts { display: flex; gap: 6px; margin-left: auto; }

/* ---- onboarding ---- */
.onboard { margin: 12px 0; }
.ob-hero { background: var(--card); border-radius: var(--r3); padding: 22px 20px; box-shadow: var(--sh1); }
.ob-hero h2 { font-size: 24px; line-height: 1.18; margin: 18px 0 8px; max-width: 18ch; }
.ob-steps { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.ob-steps li { display: flex; gap: 14px; padding: 14px; background: var(--card); border-radius: var(--r2); box-shadow: var(--sh1); }
.ob-steps li p { font-size: 13.5px; margin: 2px 0 10px; }
.ob-dot { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; }
.ob-steps li.done .ob-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.ob-steps li.done .ob-dot .ic { width: 15px; height: 15px; }
.ob-more { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---- navigation ---- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; justify-content: space-around; height: calc(var(--navh) + var(--safe-b)); padding-bottom: var(--safe-b); background: var(--card); border-top: 1px solid var(--line2); }
.nav-brand { display: none; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px 0; }
.nav-btn.on { color: var(--ink); }
.nav-btn .ic { width: 24px; height: 24px; }
.side-only { display: none; }
@media (min-width: 900px) { .phone-only { display: none !important; } }
.snap { display: grid; place-items: center; width: 64px; height: 64px; margin-top: -26px; border-radius: 50%; border: 4px solid var(--bg); background: var(--tag); color: var(--tag-ink); box-shadow: 0 6px 18px rgba(226, 163, 0, .35); flex: none; }
.snap .ic { width: 28px; height: 28px; }
.snap-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (min-width: 900px) {
  body { padding-bottom: 0; padding-left: 232px; }
  .nav { top: 0; right: auto; width: 232px; height: auto; flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 4px; padding: 20px 14px; border-top: 0; border-right: 1px solid var(--line2); }
  .nav-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; font-size: 15px; }
  .nav-btn { flex: none; flex-direction: row; gap: 12px; font-size: 14.5px; padding: 12px 14px; border-radius: 12px; }
  .nav-btn.on { background: var(--sunk); }
  .side-only { display: flex; }
  .snap { order: -1; width: auto; height: 48px; margin: 0 0 14px; border-radius: 14px; border: 0; display: flex; gap: 10px; justify-content: center; font-weight: 700; box-shadow: none; }
  .snap .ic { width: 22px; height: 22px; }
  .snap-label { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
  main { padding: 8px 32px 40px; }
  .toast-wrap, #toasts { bottom: 24px !important; }
}

/* ---- sheets, modals, toasts ---- */
.sheet-back, .modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(12, 14, 26, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet-back.out, .modal-back.out { opacity: 0; transition: opacity .18s; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
.sheet { width: 100%; max-width: 560px; background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 12px calc(16px + var(--safe-b)); animation: rise .2s ease-out; max-height: 88vh; overflow: auto; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { padding: 4px 10px 10px; }
.sheet-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 10px; border: 0; border-radius: 14px; background: none; text-align: left; }
.sheet-item:hover { background: var(--sunk); }
.si-ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--sunk); flex: none; }
.sheet-item.primary .si-ic { background: var(--tag); color: var(--tag-ink); }
.si-txt { display: flex; flex-direction: column; }
.si-txt b { font-weight: 600; font-size: 15px; }
.si-txt small { color: var(--muted); font-size: 12.5px; }
.sheet-sep { height: 1px; background: var(--line2); margin: 6px 10px; }
.modal { width: 100%; max-width: 520px; max-height: 92vh; display: flex; flex-direction: column; background: var(--card); border-radius: 22px 22px 0 0; animation: rise .2s ease-out; padding-bottom: var(--safe-b); }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 14px 10px 4px 20px; }
.modal-head h2 { flex: 1; }
.modal-body { padding: 8px 20px 12px; overflow: auto; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px 16px; border-top: 1px solid var(--line2); flex-wrap: wrap; }
.modal-actions .btn { flex: 1 1 auto; }
@media (min-width: 640px) { .modal-back { align-items: center; } .modal { border-radius: 22px; } .modal-actions .btn { flex: 0 0 auto; } }
.progress-body { display: flex; flex-direction: column; gap: 12px; padding: 6px 0 4px; min-width: 260px; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--navh) + var(--safe-b) + 14px); z-index: 80; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 460px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--sh2); pointer-events: auto; animation: rise .2s ease-out; transition: opacity .3s, transform .3s; }
.toast.out { opacity: 0; transform: translateY(8px); }
body.noscroll #toasts { bottom: auto; top: calc(64px + env(safe-area-inset-top, 0px)); }
.toast.bad { background: var(--bad); color: #fff; }
.toast > span:not(.ic) { flex: 1; text-align: left; }
.toast-act { border: 0; background: rgba(255,255,255,.18); color: inherit; padding: 6px 10px; border-radius: 8px; font-weight: 600; }
.batch { position: fixed; left: 12px; right: 12px; bottom: calc(var(--navh) + var(--safe-b) + 12px); z-index: 30; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--card); border-radius: 14px; box-shadow: var(--sh2); font-size: 13px; max-width: 420px; margin: 0 auto; }
@media (min-width: 900px) { .batch { left: auto; right: 24px; bottom: 24px; width: 360px; } }

/* ---- editor ---- */
.editor { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--stage); color: #EEF0F8; animation: fade .15s; }
.editor.out { opacity: 0; transition: opacity .18s; }
.ed-top { display: flex; align-items: center; gap: 4px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); background: var(--stage); }
.ed-top .icon-btn:hover { background: var(--stage2); }
.ed-steps { flex: 1; display: flex; justify-content: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.ed-step { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 62px; padding: 5px 6px; border: 0; border-radius: 10px; background: none; color: #9BA3C4; font-size: 11.5px; font-weight: 600; }
.ed-step .ic { width: 20px; height: 20px; }
.ed-step.on { color: #fff; background: var(--stage2); }
.ed-step.on .ic { color: var(--tag); }
.ed-step:disabled { opacity: .35; }
.ed-save { background: var(--tag) !important; color: var(--tag-ink) !important; }
.ed-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ed-stage { position: relative; flex: 1; min-height: 34vh; overflow: hidden; touch-action: none; background: radial-gradient(circle at 50% 40%, #1E243C, var(--stage) 70%); }
.editor[data-step=details] .ed-stage { flex: 0 0 26vh; min-height: 150px; }
.ed-view { position: absolute; transform-origin: 0 0; will-change: transform; }
.ed-canvas { display: block; }
.editor[data-step=cutout] .ed-canvas, .editor[data-step=look] .ed-canvas, .editor[data-step=details] .ed-canvas { background: conic-gradient(#3A4060 25%, #2C3150 0 50%, #3A4060 0 75%, #2C3150 0) 0 0 / 18px 18px; border-radius: 4px; }
.editor[data-step=look] .ed-canvas, .editor[data-step=details] .ed-canvas { background: #F2F1EC; box-shadow: 0 0 0 10px #F2F1EC; }
.ed-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; --sw: 1.6; }
.ed-svg .dim { fill: rgba(9, 11, 22, .58); }
.ed-svg .q-shadow { fill: none; stroke: rgba(0,0,0,.55); stroke-width: calc(var(--sw) * 3); stroke-linejoin: round; }
.ed-svg .q-line { fill: none; stroke: var(--tag); stroke-width: calc(var(--sw) * 1.4); stroke-linejoin: round; }
.ed-svg .q-line.bad { stroke: #FF5D7A; stroke-dasharray: 6 4; }
.ed-svg .q-guide { stroke: rgba(255,255,255,.35); stroke-width: var(--sw); stroke-dasharray: 3 4; }
.editor:not([data-step=frame]) .ed-handles { display: none; }
.handle { position: absolute; width: 48px; height: 48px; transform: translate(-50%, -50%) scale(var(--inv, 1)); display: grid; place-items: center; touch-action: none; }
.handle i { width: 24px; height: 24px; border-radius: 50%; background: var(--tag); border: 3px solid var(--stage); box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,.5); }
.handle:focus-visible i { box-shadow: 0 0 0 3px var(--focus), 0 2px 8px rgba(0,0,0,.5); }
.loupe { position: absolute; top: 12px; left: 12px; width: 132px; height: 132px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 6px 24px rgba(0,0,0,.6); opacity: 0; transform: scale(.85); transition: opacity .12s, transform .12s; pointer-events: none; }
.loupe.on { opacity: 1; transform: none; }
.loupe.right { left: auto; right: 12px; }
.brush-dot { position: absolute; display: none; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; }
.brush-dot.erase { border-color: #FF8FA3; }
.brush-dot.restore { border-color: #7CF0C2; }
.ed-stage:not(.brushing) .brush-dot { display: none !important; }
.ed-note { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 86%; padding: 0; border-radius: 12px; background: rgba(12, 14, 26, .82); color: #fff; font-size: 13px; text-align: center; pointer-events: none; }
.ed-note:not(:empty) { padding: 8px 12px; }
.ed-busy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: rgba(12, 14, 26, .88); color: #fff; font-size: 14px; }
.ed-busy.on { display: flex; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.25); border-top-color: var(--tag); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ed-empty { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #C9CEE3; }
.ed-stage.nophoto .ed-empty { display: flex; }
.ed-tray { background: var(--card); color: var(--ink); border-radius: 20px 20px 0 0; padding: 14px 16px calc(14px + var(--safe-b)); max-height: 52vh; overflow-y: auto; overscroll-behavior: contain; }
.editor[data-step=details] .ed-tray { max-height: none; flex: 1; }
.tray-hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.tray-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.tray-row.wrap { flex-wrap: wrap; }
.tray-row > .small { min-width: 76px; }
.tool { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 13.5px; font-weight: 500; }
.tool:disabled { opacity: .4; }
.tool .ic { width: 18px; height: 18px; }
.tray-next { position: sticky; bottom: calc(-14px - var(--safe-b)); display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0 2px; margin-top: 8px; background: linear-gradient(transparent, var(--card) 30%); }
.tray-next.two .btn { flex: 1; }
.qwarn { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 10px; margin-bottom: 8px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
.qwarn span { display: inline-flex; gap: 5px; align-items: center; }
.qwarn .ic { width: 15px; height: 15px; }
.details-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.card-prev-wrap { order: -1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.card-preview { width: 100%; max-width: 240px; display: flex; justify-content: center; }
.card-preview canvas { border-radius: 10px; box-shadow: var(--sh1); max-width: 100%; height: auto; }
.df { margin-bottom: 10px; }
.df label { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
.df.off label { color: var(--muted); }
.df-in { position: relative; display: flex; gap: 6px; align-items: center; }
.df-in input, .df-in textarea { flex: 1; }
.money-prev { position: absolute; right: 52px; font-size: 13px; font-weight: 600; color: var(--muted); pointer-events: none; }
.pin { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); }
.pin.on { background: var(--tag); border-color: var(--tag-deep); color: var(--tag-ink); }
.pin .ic { width: 18px; height: 18px; }
@media (min-width: 900px) {
  .editor { left: 0; }
  .ed-main { flex-direction: row; }
  .ed-tray { width: 400px; max-height: none; border-radius: 0; flex: none; }
  .editor[data-step=details] .ed-stage { flex: 1; }
  .editor[data-step=details] .ed-tray { width: 560px; flex: none; }
  .details-grid { grid-template-columns: 1fr 220px; }
  .card-prev-wrap { order: 0; }
}

/* ---- catalogue ---- */
.pv { margin: 8px -16px 0; }
.pv-strip { display: flex; gap: 14px; overflow-x: auto; padding: 8px 16px 14px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.pv-page { position: relative; flex: none; width: min(64vw, 300px); background: #fff; border-radius: 4px; box-shadow: 0 2px 4px rgba(19,23,42,.08), 0 10px 26px rgba(19,23,42,.14); scroll-snap-align: center; overflow: hidden; }
.pv-page canvas { display: block; width: 100%; height: 100%; }
.pv-no { position: absolute; bottom: 6px; right: 8px; font-size: 11px; color: #8A8F9F; }
.pv-page canvas + .pv-no, .pv-page .pv-no:has(+ canvas) { display: none; }
.pv-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }
.linkish-label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.excl { padding: 6px 16px 0; margin: 0; color: var(--warn); }
.excl:empty { display: none; }
.cat-panels { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.panel { background: var(--card); border-radius: var(--r2); padding: 16px; box-shadow: var(--sh1); }
.panel > h3 { margin-bottom: 10px; }
.panel h3 + .perpage, .panel h3 + .swatches { margin-bottom: 16px; }
details.panel > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; min-height: 28px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: ''; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 10px; transition: transform .15s; }
details.panel[open] > summary::after { transform: rotate(-135deg); margin-bottom: -4px; }
details.panel > summary h3 { flex: 1; }
details.panel[open] > summary { margin-bottom: 6px; }
.perpage { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pp { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); }
.pp b { font-size: 13px; }
.pp-glyph svg { width: 26px; height: 34px; display: block; fill: var(--line); }
.pp.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.pp.on .pp-glyph svg { fill: var(--tag); }
@media (min-width: 560px) { .perpage { grid-template-columns: repeat(10, 1fr); } }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1.5px solid transparent; border-radius: 12px; background: none; }
.sw.on { border-color: var(--ink); }
.sw small { font-size: 12px; color: var(--ink2); }
.sw-page { position: relative; width: 44px; height: 58px; border-radius: 4px; border: 1px solid; overflow: hidden; }
.sw-page i { position: absolute; left: 0; right: 0; top: 0; height: 40%; }
.sw-page em { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 34%; border-radius: 3px; }
.cta { position: sticky; bottom: calc(var(--navh) + var(--safe-b)); z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0; margin: 12px 0 0; background: linear-gradient(transparent, var(--bg) 28%); }
.cta .btn.primary { flex: 1 1 200px; }
@media (min-width: 900px) { .cta { bottom: 0; } }
.empty-cat { padding: 32px 20px; text-align: center; background: var(--card); border-radius: var(--r2); margin-top: 12px; color: var(--muted); }
.result .res-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.res-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); }
.res-file { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line2); }
.rf-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rf-name span { font-size: 13.5px; font-weight: 600; word-break: break-all; }
@media (min-width: 1100px) {
  .catalogue-wide { display: grid; grid-template-columns: 1fr 420px; gap: 24px; }
}

/* ---- settings ---- */
.settings { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.logo-prev { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
.lp { display: grid; place-items: center; height: 96px; border-radius: 12px; padding: 12px; }
.lp img { max-height: 100%; max-width: 100%; object-fit: contain; }
.lp.light { background: #fff; border: 1px solid var(--line); }
.lp.dark { background: #111218; }
.lp.dark img { background: #fff; padding: 6px 8px; border-radius: 8px; }
.logo-empty { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 96px; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); }
.fields-list { display: flex; flex-direction: column; gap: 8px; }
.frow { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; background: var(--sunk); }
.frow.off { opacity: .6; }
.fr-move { display: flex; flex-direction: column; }
.fr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.fr-label { min-height: 38px !important; padding: 6px 10px !important; font-weight: 600; }
.fr-opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fr-opts select { width: auto; min-height: 34px; padding: 4px 8px; font-size: 13px; }
.mini { font-size: 12.5px; color: var(--ink2); display: inline-flex; align-items: center; gap: 4px; }
.fr-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.switch-sm { position: relative; display: inline-block; width: 40px; height: 24px; }
.switch-sm input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch-sm i { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background .15s; }
.switch-sm i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch-sm input:checked + i { background: var(--ok); }
.switch-sm input:checked + i::after { transform: translateX(16px); }
.storage { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
.help-links { display: flex; flex-direction: column; }
.hl { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line2); background: none; text-align: left; font-size: 14.5px; }
.hl:last-child { border-bottom: 0; }
.help-item { padding: 8px 0; border-bottom: 1px solid var(--line2); }
.help-item:last-of-type { border-bottom: 0; }
.help-item p { margin: 2px 0 0; color: var(--ink2); font-size: 14px; }
.danger-zone h3 { color: var(--bad); margin-bottom: 10px; }
.map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.form .toggle { border-bottom: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>

/* ===================== 01 · Storage (IndexedDB, autosave) ===================== */
const DB = (() => {
  const NAME = 'catalogue-maker', VER = 1;
  let db = null;
  let memory = null; // fallback when IndexedDB is unavailable (some private modes / file:// viewers)
  const STORES = ['products', 'blobs', 'kv'];
  const KEYS = { products: 'id', blobs: 'id', kv: 'k' };

  function req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

  async function open() {
    if (db || memory) return true;
    try {
      if (!window.indexedDB) throw new Error('IndexedDB missing');
      db = await new Promise((resolve, reject) => {
        const r = indexedDB.open(NAME, VER);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: KEYS[s] });
        };
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.onblocked = () => reject(new Error('Database blocked by another tab'));
        setTimeout(() => reject(new Error('Database open timed out')), 8000);
      });
      db.onversionchange = () => { db.close(); db = null; };
      // probe write: some embedded viewers expose IDB but throw on write
      await put('kv', { k: '__probe', v: Date.now() });
      return true;
    } catch (e) {
      LOG.add('error', 'Storage unavailable, using temporary memory', e && e.message);
      db = null;
      memory = { products: new Map(), blobs: new Map(), kv: new Map() };
      return false;
    }
  }
  const persistent = () => !!db;

  function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
  /** Run writes in one transaction; resolve only when the transaction has COMMITTED (storage-full errors surface here). */
  function write(store, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = db.transaction(store, 'readwrite'); fn(t.objectStore(store)); }
      catch (e) { rej(e); return; }
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error || new Error('Write failed'));
      t.onabort = () => rej(t.error || new Error('Write aborted (phone storage may be full)'));
    });
  }

  async function get(store, key) {
    if (memory) return memory[store].get(key);
    return req(tx(store, 'readonly').get(key));
  }
  async function put(store, value) {
    if (memory) { memory[store].set(value[KEYS[store]], value); return; }
    return write(store, os => os.put(value));
  }
  async function del(store, key) {
    if (memory) { memory[store].delete(key); return; }
    return write(store, os => os.delete(key));
  }
  async function all(store) {
    if (memory) return Array.from(memory[store].values());
    return req(tx(store, 'readonly').getAll());
  }
  async function allKeys(store) {
    if (memory) return Array.from(memory[store].keys());
    return req(tx(store, 'readonly').getAllKeys());
  }
  async function clearStore(store) {
    if (memory) { memory[store].clear(); return; }
    return write(store, os => os.clear());
  }
  async function putMany(store, values) {
    if (memory) { for (const v of values) memory[store].set(v[KEYS[store]], v); return; }
    if (!values.length) return;
    return write(store, os => { for (const v of values) os.put(v); });
  }
  async function delMany(store, keys) {
    if (memory) { for (const k of keys) memory[store].delete(k); return; }
    keys = keys.filter(Boolean); if (!keys.length) return;
    return write(store, os => { for (const k of keys) os.delete(k); });
  }
  /* blobs */
  async function putBlob(blob, id) {
    id = id || 'b' + uid();
    await put('blobs', { id, blob, type: blob.type, size: blob.size });
    return id;
  }
  async function getBlob(id) { if (!id) return null; const r = await get('blobs', id); return r ? r.blob : null; }
  async function delBlob(id) { if (id) await del('blobs', id); }
  /* key-value */
  async function getKV(k, def) { const r = await get('kv', k); return r ? r.v : def; }
  async function setKV(k, v) { return put('kv', { k, v }); }

  async function estimate() {
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) { }
    return null;
  }
  async function askPersist() {
    try { if (navigator.storage && navigator.storage.persist) { if (await navigator.storage.persisted()) return true; return await navigator.storage.persist(); } } catch (e) { }
    return false;
  }
  async function isPersisted() { try { return navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; } catch (e) { return false; } }

  return { open, persistent, get, put, del, all, allKeys, clear: clearStore, putMany, delMany, putBlob, getBlob, delBlob, getKV, setKV, estimate, askPersist, isPersisted };
})();

  ready: false, faces: {},

    serif: { css: 'CM Serif', regular: 'lora-400', medium: 'lora-700', bold: 'lora-700' }

  async init() {
    if (this.ready) return;
    for (const key in FONT_DATA) {
      const bytes = b64ToBytes(FONT_DATA[key]);
      this.faces[key] = new TTF(bytes, key);

    try {
      const defs = [['CM Sans', 'poppins-400', '400'], ['CM Sans', 'poppins-500', '500'], ['CM Sans', 'poppins-700', '700'], ['CM Serif', 'lora-400', '400'], ['CM Serif', 'lora-700', '700']];

}

/* ---- 03-pdf.js ---- */
/* ===================== 03 · PDF writer (no external libraries) =====================
 * Embeds TrueType subsets as Type0/CIDFontType2 (Identity-H) with ToUnicode → searchable text, ₹ works.
 * JPEG images (DCTDecode) with optional soft-mask alpha (cut-out products over any page colour).
 * Link annotations (WhatsApp / web), internal page links, bookmarks (outline), metadata.
 * Output is assembled from byte chunks into a Blob, so big catalogues don't need one huge string.
 */
const PDF_ = {
  latin1(s) { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; },
  num(n) { if (!isFinite(n)) return '0'; const r = Math.round(n * 1000) / 1000; return (Object.is(r, -0) ? 0 : r).toString(); },
  color(c) {
    if (Array.isArray(c)) return c.map(v => PDF_.num(v / 255)).join(' ');
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c || '#000000') || [0, '00', '00', '00'];
    return [m[1], m[2], m[3]].map(x => PDF_.num(parseInt(x, 16) / 255)).join(' ');
  },
  str(s) {
    // ASCII → literal string; anything else → UTF-16BE hex with BOM
    s = String(s || '');
    if (/^[\x20-\x7e]*$/.test(s)) return '(' + s.replace(/([\\()])/g, '\\$1') + ')';
    let hex = 'FEFF';
    for (let i = 0; i < s.length; i++) hex += s.charCodeAt(i).toString(16).padStart(4, '0');
    return '<' + hex.toUpperCase() + '>';
  },
  async deflate(u8) {
    if (typeof CompressionStream === 'undefined') { try { return Deflate.zlib(u8); } catch (e) { return null; } }
    try {
      const stream = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    } catch (e) { return null; }
  },
  date(d = new Date()) {
    const p = n => String(n).padStart(2, '0');
    const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-', oh = p(Math.floor(Math.abs(off) / 60)), om = p(Math.abs(off) % 60);
    return `D:${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${sign}${oh}'${om}'`;
  }
};

class PDFWriter {
  constructor(meta = {}) {
    this.parts = []; this.pos = 0; this.offsets = [];
    this.nextId = 3; // 1 = Catalog, 2 = Pages
    this.pageIds = []; this.pageCount = 0;
    this.fonts = []; this.imageCount = 0; this.bookmarks = [];

  alloc() { return this.nextId++; }
  _write(x) {
    const b = typeof x === 'string' ? PDF_.latin1(x) : x;

  }
  _obj(id, body) { this.offsets[id] = this.pos; this._write(id + ' 0 obj\n' + body + '\nendobj\n'); }

  async addJPEG(bytes, w, h, alpha) {

      await this._stream(sid, `/Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceGray /BitsPerComponent 8`, alpha, true);
      smask = ` /SMask ${sid} 0 R`;

  /** Raw RGB (Uint8Array w*h*3) lossless + optional alpha */
  async addRGB(rgb, w, h, alpha) {
    let smask = '';
    if (alpha) {
      const sid = this.alloc();
      await this._stream(sid, `/Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceGray /BitsPerComponent 8`, alpha, true);
      smask = ` /SMask ${sid} 0 R`;

  }
  page(w, h) {
    const index = this.pageCount++;
    if (!this.pageIds[index]) this.pageIds[index] = this.alloc();
    return new PDFPage(this, w, h, index, this.pageIds[index]);
  }
  addBookmark(title, pageIndex) { this.bookmarks.push({ title, pageIndex }); }

  async finish() {
    // fonts
    let tagN = 0;
    for (const f of this.fonts) {
      const t = f.ttf, s = 1000 / t.upem;
      const tag = 'CM' + String.fromCharCode(65 + (tagN % 26), 65 + ((tagN / 26 | 0) % 26), 65 + (f.key.length % 26), 65 + 7) ; tagN++;
      const base = '/' + tag + '+' + (t.psName || 'Font');

      await this._stream(fileId, `/Length1 ${t.bytes.length}`, t.bytes, true);

      const ascent = Math.round((t.typoAsc || t.ascender) * s), descent = Math.round((t.typoDesc || t.descender) * s);
      this._obj(descId, `<< /Type /FontDescriptor /FontName ${base} /Flags 4 /FontBBox [${bb.join(' ')}] /ItalicAngle ${PDF_.num(t.italicAngle)} /Ascent ${ascent} /Descent ${descent} /CapHeight ${Math.round(t.capHeight * s)} /StemV ${t.weight >= 600 ? 140 : 80} /FontFile2 ${fileId} 0 R >>`);
      const widths = []; for (let g = 0; g < t.numGlyphs; g++) widths.push(Math.round(t.adv[g] * s));
      let W = ''; for (let i = 0; i < widths.length; i += 64) W += i + ' [' + widths.slice(i, i + 64).join(' ') + ']\n';
      this._obj(cidId, `<< /Type /Font /Subtype /CIDFontType2 /BaseFont ${base} /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${descId} 0 R /DW 1000 /W [${W}] /CIDToGIDMap /Identity >>`);

      const rev = new Map();
      for (const [cp, g] of t.cmap) if (!rev.has(g) && cp <= 0xFFFF) rev.set(g, cp);
      const entries = Array.from(rev.entries()).sort((a, b) => a[0] - b[0]);
      let cmap = '/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n';
      for (let i = 0; i < entries.length; i += 100) {
        const chunk = entries.slice(i, i + 100);
        cmap += chunk.length + ' beginbfchar\n' + chunk.map(([g, cp]) => '<' + g.toString(16).padStart(4, '0') + '> <' + cp.toString(16).padStart(4, '0') + '>').join('\n') + '\nendbfchar\n';
      }
      cmap += 'endcmap\nCMapName currentdict /CMap defineresource pop\nend\nend';
      await this._stream(tuId, '', PDF_.latin1(cmap), true);
      this._obj(f.id, `<< /Type /Font /Subtype /Type0 /BaseFont ${base} /Encoding /Identity-H /DescendantFonts [${cidId} 0 R] /ToUnicode ${tuId} 0 R >>`);
    }
    // page tree (only pages that were actually written)
    const kids = this.pageIds.slice(0, this.pageCount);
    this._obj(2, `<< /Type /Pages /Kids [${kids.map(id => id + ' 0 R').join(' ')}] /Count ${kids.length} >>`);
    // outline
    let outlines = '';
    const bms = this.bookmarks.filter(b => b.pageIndex < this.pageCount);
    if (bms.length) {
      const rootId = this.alloc(); const ids = bms.map(() => this.alloc());
      bms.forEach((b, i) => {
        this._obj(ids[i], `<< /Title ${PDF_.str(b.title)} /Parent ${rootId} 0 R${i > 0 ? ` /Prev ${ids[i - 1]} 0 R` : ''}${i < bms.length - 1 ? ` /Next ${ids[i + 1]} 0 R` : ''} /Dest [${this.pageIds[b.pageIndex]} 0 R /Fit] >>`);
      });
      this._obj(rootId, `<< /Type /Outlines /First ${ids[0]} 0 R /Last ${ids[ids.length - 1]} 0 R /Count ${ids.length} >>`);
      outlines = ` /Outlines ${rootId} 0 R /PageMode /UseOutlines`;
    }
    const m = this.meta;
    const infoId = this.alloc();
    this._obj(infoId, `<< /Title ${PDF_.str(m.title || 'Catalogue')} /Author ${PDF_.str(m.author || '')} /Subject ${PDF_.str(m.subject || '')} /Creator ${PDF_.str(APP.name + ' ' + APP.version)} /Producer ${PDF_.str(APP.name)} /CreationDate ${PDF_.str(PDF_.date())} >>`);

    this._write(x);
    const blob = new Blob(this.parts, { type: 'application/pdf' });
    this.parts = [];
    return blob;
  }
}

class PDFPage {
  constructor(doc, w, h, index, id) {
    this.doc = doc; this.w = w; this.h = h; this.index = index; this.id = id;

    const k = 0.5523 * r;

      `${n(x + r)} ${n(Y(y))} m`,
      `${n(x + w - r)} ${n(Y(y))} l`, `${n(x + w - r + k)} ${n(Y(y))} ${n(x + w)} ${n(Y(y + r - k))} ${n(x + w)} ${n(Y(y + r))} c`,
      `${n(x + w)} ${n(Y(y + h - r))} l`, `${n(x + w)} ${n(Y(y + h - r + k))} ${n(x + w - r + k)} ${n(Y(y + h))} ${n(x + w - r)} ${n(Y(y + h))} c`,
      `${n(x + r)} ${n(Y(y + h))} l`, `${n(x + r - k)} ${n(Y(y + h))} ${n(x)} ${n(Y(y + h - r + k))} ${n(x)} ${n(Y(y + h - r))} c`,
      `${n(x)} ${n(Y(y + r))} l`, `${n(x)} ${n(Y(y + r - k))} ${n(x + r - k)} ${n(Y(y))} ${n(x + r)} ${n(Y(y))} c`, 'h'
    ].join('\n');

    if (!o.fill && !o.stroke) return;

    if (o.fill) this.ops.push(PDF_.color(o.fill) + ' rg');
    if (o.stroke) this.ops.push(PDF_.color(o.stroke) + ' RG ' + PDF_.num(o.lw || 0.5) + ' w');

  }
}

/* ===================== 04 · Image utilities ===================== */
const IMG = {

  async headerSize(blob) {

      if (b[0] === 0x52 && b[1] === 0x49 && b[8] === 0x57 && b[9] === 0x45) {

  async decode(blob, maxSide) {

      const hs = await IMG.headerSize(blob);

    }
    try { if (window.createImageBitmap) return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { }
    try { return await IMG._viaImg(blob); } catch (e) { throw new Error('Could not open this image (' + (blob.type || name || 'unknown type') + ').'); }
  },
  _viaImg(blob) {

    });

  toCanvas(img, maxSide = 2000, rotation = 0) {

    const ctx = out.getContext('2d');

          if (fn) { this.mod = { removeBackground: fn, preload: m.preload || (m.default && m.default.preload) }; this.url = u; return this.mod; }
          lastErr = new Error('AI library loaded but removeBackground was not found');
        } catch (e) { lastErr = e; LOG.add('warn', 'AI import failed ' + u, e && e.message); }
      }
      throw new Error('Could not load the AI tool (offline or blocked). ' + (lastErr ? lastErr.message : ''));
    })();
    try { return await this.loading; } catch (e) { this.loading = null; this.failed = e.message; throw e; }
  },
  /** returns Uint8Array alpha at the image's resolution */
  async mask(canvas, quality, onProgress) {
    const m = await this.load(onProgress);
    const blob = await IMG.toBlob(canvas, 'image/jpeg', 0.92);
    const model = quality === 'best' ? 'isnet_fp16' : 'isnet_quint8';
    const progress = (key, cur, total) => {
      if (!onProgress) return;
      if (/fetch/.test(key)) onProgress({ phase: 'download', cur, total, text: 'Downloading AI model (one time)…' });
      else onProgress({ phase: 'compute', text: 'Removing background…' });
    };
    const base = { output: { format: 'image/png', type: 'foreground', quality: 1 }, progress };
    const tries = [
      Object.assign({ model, proxyToWorker: false, device: 'cpu' }, base),
      Object.assign({ model }, base),
      base
    ];
    let out = null, err = null;
    for (const cfg of tries) { try { out = await m.removeBackground(blob, cfg); break; } catch (e) { err = e; LOG.add('warn', 'AI config failed', e && e.message); } }
    if (!out) throw err || new Error('AI failed');
    const img = await IMG.decode(out);
    const c = IMG.canvas(canvas.width, canvas.height); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    if (img.close) img.close();
    const d = IMG.data(c).data, n = c.width * c.height, a = new Uint8Array(n);
    for (let i = 0; i < n; i++) a[i] = d[i * 4 + 3];
    IMG.release(c);
    return a;
  }
};

/* ---- 07-pipeline.js ---- */
/* ===================== 07 · Product photo pipeline ===================== */
const PIPE = {
  SRC: 2000,   // stored original (longest side)
  WORK: 448,   // quick-cut working size
  REF: 1024,   // mask resolution
  OUT: 1400,   // finished cut-out (longest side)

  defaultEdit(settings) {
    return {
      rot: 0, quad: null, persp: true, aspect: 'auto',
      bg: (settings && settings.photo && settings.photo.bg) || 'quick',
      smooth: 35,
      look: { auto: true, brightness: 0, contrast: 0, saturation: 0, warmth: 0, sharpen: 15 },
      brushed: false
    };
  },
  /** File → stored source JPEG + canvas */
  async importPhoto(file, rot = 0) {
    const img = await IMG.decode(file, PIPE.SRC);
    const canvas = IMG.toCanvas(img, PIPE.SRC, rot);
    if (img.close) img.close();
    const blob = await IMG.toBlob(canvas, 'image/jpeg', 0.9);
    const quality = IMG.quality(canvas);
    return { canvas, blob, quality };
  },
  async sourceCanvas(srcBlob, rot = 0) {
    const img = await IMG.decode(srcBlob, PIPE.SRC);
    const c = IMG.toCanvas(img, PIPE.SRC, rot);
    if (img.close) img.close();
    return c;
  },
  scaled(canvas, maxSide) {
    const s = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
    const c = IMG.canvas(canvas.width * s, canvas.height * s), x = c.getContext('2d');
    x.imageSmoothingQuality = 'high'; x.drawImage(canvas, 0, 0, c.width, c.height);
    return c;
  },
  /** Compute cut-out mask for the whole photo → {data:Uint8Array(0..255), w, h} at ≤REF */
  async mask(srcCanvas, mode, quadN, smooth, aiQuality, onProgress) {
    if (mode === 'none') return null;
    const guideC = PIPE.scaled(srcCanvas, PIPE.REF), guide = IMG.data(guideC);
    try {
      if (mode === 'ai') {
        const aiInput = PIPE.scaled(srcCanvas, 1600);
        const a = await AI.mask(aiInput, aiQuality, onProgress);
        let m = SEG.resize(a, aiInput.width, aiInput.height, guide.width, guide.height);
        IMG.release(aiInput);
        // No clipping to the frame here: the straighten step crops to the frame anyway, and a clipped mask
        // would go stale when the corners are moved later.
        if (smooth > 45) m = SEG.feather(m, guide.width, guide.height, Math.round((smooth - 45) / 18));
        return { data: m, w: guide.width, h: guide.height };
      }
      onProgress && onProgress({ phase: 'compute', text: 'Cutting out…' });
      await yieldUI();
      const workC = PIPE.scaled(srcCanvas, PIPE.WORK), work = IMG.data(workC);
      const bin = SEG.quickCut(work, quadN, 3);
      await yieldUI();
      const m = SEG.refine(bin, work.width, work.height, guide, smooth, true);
      IMG.release(workC);
      return { data: m, w: guide.width, h: guide.height };
    } finally { IMG.release(guideC); }
  },
  /** Suggest corners: run a quick cut on the whole photo and fit a quad. */
  async autoCorners(srcCanvas, existingMask) {
    let m = existingMask;
    if (!m) {
      const workC = PIPE.scaled(srcCanvas, 360), work = IMG.data(workC), w = work.width, h = work.height;
      let bin = SEG.quickCut(work, null, 3);
      // cut thin bridges to neighbouring objects, keep the central product
      bin = SEG.dilate(SEG.erode(bin, w, h, 3), w, h, 3);
      const seed = new Uint8Array(w * h);
      for (let y = Math.round(h * 0.35); y < h * 0.65; y++) for (let x = Math.round(w * 0.35); x < w * 0.65; x++) seed[y * w + x] = 1;
      bin = SEG.keepMain(bin, w, h, seed);
      m = { data: bin.map(v => v * 255), w, h };
      IMG.release(workC);
    }
    return GEOM.quadFromMask(m.data, m.w, m.h);
  },
  /** Straighten + cut-out + look → finished RGBA canvas (trimmed). */
  render(srcCanvas, srcData, mask, edit, autoParams) {
    const sw = srcCanvas.width, sh = srcCanvas.height;
    let qn = edit.quad || GEOM.fullQuad();
    if (!edit.persp) { const b = GEOM.bounds(qn); qn = [{ x: b.x0, y: b.y0 }, { x: b.x1, y: b.y0 }, { x: b.x1, y: b.y1 }, { x: b.x0, y: b.y1 }]; }
    const q = qn.map(p => ({ x: p.x * sw, y: p.y * sh }));
    const size = GEOM.outSize(q, edit.aspect, PIPE.OUT);
    const warped = GEOM.warp(srcData, mask, q, size.w, size.h);
    const look = Object.assign({}, edit.look);
    if (look.auto && autoParams) look.auto = autoParams; else look.auto = null;
    IMG.adjust(warped, look);
    const c = IMG.fromData(warped);
    if (!mask) return c;
    const t = IMG.trim(c, 0.012, 12);
    if (t !== c) IMG.release(c);
    return t;
  },
  autoParamsFor(srcData, mask) {
    let a = null;
    if (mask) a = SEG.resize(mask.data, mask.w, mask.h, srcData.width, srcData.height);
    return IMG.autoParams(srcData.data, srcData.width, srcData.height, a);
  },
  async thumb(outCanvas, bg = '#F2F1EC') {
    const S = 360, c = IMG.canvas(S, S), x = c.getContext('2d');
    x.fillStyle = bg; x.fillRect(0, 0, S, S);
    const pad = S * 0.08, bw = S - pad * 2, bh = S - pad * 2.4;
    const s = Math.min(bw / outCanvas.width, bh / outCanvas.height);
    const w = outCanvas.width * s, h = outCanvas.height * s, X = (S - w) / 2, Y = pad + bh - h;
    const g = x.createRadialGradient(S / 2, Y + h, 1, S / 2, Y + h, w * 0.5);
    g.addColorStop(0, 'rgba(0,0,0,0.20)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.save(); x.translate(S / 2, Y + h); x.scale(1, 0.09); x.translate(-S / 2, -(Y + h)); x.fillStyle = g; x.beginPath(); x.arc(S / 2, Y + h, w * 0.5, 0, Math.PI * 2); x.fill(); x.restore();
    x.imageSmoothingQuality = 'high'; x.drawImage(outCanvas, X, Y, w, h);
    const b = await IMG.toBlob(c, 'image/jpeg', 0.82);
    IMG.release(c);
    return b;
  },
  async maskToBlob(mask) {
    const c = IMG.canvas(mask.w, mask.h), x = c.getContext('2d'), id = x.createImageData(mask.w, mask.h), d = id.data;
    for (let i = 0, j = 0; i < mask.data.length; i++, j += 4) { d[j] = d[j + 1] = d[j + 2] = mask.data[i]; d[j + 3] = 255; }
    x.putImageData(id, 0, 0);
    const b = await IMG.toBlob(c, 'image/png');
    IMG.release(c);
    return b;
  },
  async blobToMask(blob) {
    if (!blob) return null;
    const img = await IMG.decode(blob);
    const { w, h } = IMG.dims(img);
    const c = IMG.canvas(w, h); c.getContext('2d').drawImage(img, 0, 0);
    if (img.close) img.close();
    const d = IMG.data(c).data, m = new Uint8Array(w * h);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4];
    IMG.release(c);
    return { data: m, w, h };
  },
  /** Fully automatic processing (batch import): corners + cut-out + look. */
  async autoProcess(file, settings, onProgress) {
    const { canvas, blob, quality } = await PIPE.importPhoto(file);
    const edit = PIPE.defaultEdit(settings);
    let mask = null;
    if (edit.bg === 'ai') {
      try { mask = await PIPE.mask(canvas, 'ai', null, edit.smooth, settings.photo.aiQuality, onProgress); }
      catch (e) { LOG.add('warn', 'AI unavailable in batch, using Quick', e.message); edit.bg = 'quick'; }
    }
    const ac = await PIPE.autoCorners(canvas, mask);
    edit.quad = ac.quad; edit.persp = ac.boxLike;
    if (edit.bg === 'quick') mask = await PIPE.mask(canvas, 'quick', ac.found ? ac.quad : null, edit.smooth, null, onProgress);
    const srcData = IMG.data(canvas);
    const ap = PIPE.autoParamsFor(srcData, mask);
    const out = PIPE.render(canvas, srcData, mask, edit, ap);
    const res = { srcBlob: blob, srcW: canvas.width, srcH: canvas.height, mask, out, edit, autoParams: ap, quality, review: !ac.found || !ac.confident };
    IMG.release(canvas);
    return res;
  },
  /** Write new images for a product and point p.img at them. Returns ids of the replaced blobs:
   *  callers delete those only AFTER the product record itself has been saved (so a failed save loses nothing). */
  async store(p, parts, keepSource = true) {
    const old = Object.assign({}, p.img || {});
    const img = Object.assign({}, p.img || {});
    if (parts.srcBlob) { img.src = keepSource ? await DB.putBlob(parts.srcBlob) : null; img.sw = parts.srcW; img.sh = parts.srcH; }
    if (parts.mask !== undefined) img.mask = parts.mask ? await DB.putBlob(await PIPE.maskToBlob(parts.mask)) : null;
    if (parts.out) {
      const t = IMG.alphaType();
      img.out = await DB.putBlob(await IMG.toBlob(parts.out, t, t === 'image/webp' ? 0.92 : undefined));
      img.ow = parts.out.width; img.oh = parts.out.height;
      img.thumb = await DB.putBlob(await PIPE.thumb(parts.out));
    }
    const stale = [];
    for (const k of ['src', 'mask', 'out', 'thumb']) if (old[k] && old[k] !== img[k]) stale.push(old[k]);
    p.img = img;
    return stale;
  },
  /** Save a product record, then remove the blobs it no longer uses. */
  async commit(p, stale) {
    await App.saveProduct(p);
    if (stale && stale.length) { try { await DB.delMany('blobs', stale); } catch (e) { LOG.add('warn', 'stale blob cleanup failed', e.message); } }
  }
};
